<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3730a3" />
    <title>Sin conexión — MultiCatálogo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #312e81, #4c1d95);
        color: #eef2ff;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 1rem;
        padding: 1.75rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; opacity: 0.9; font-size: 0.95rem; line-height: 1.45; }
      button {
        background: #fff;
        color: #3730a3;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        font-weight: 600;
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sin conexión</h1>
      <p>
        MultiCatálogo no puede cargar esta página sin red.
        Revisa tu conexión e inténtalo de nuevo.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
